name: .NET Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: WallpaperSwitcher.slnx
  DESKTOP_PROJECT: src/WallpaperSwitcher.Desktop/WallpaperSwitcher.Desktop.csproj
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore $env:SOLUTION_PATH

      - name: Verify formatting
        run: dotnet format $env:SOLUTION_PATH whitespace --verify-no-changes --no-restore

      - name: Build application
        run: dotnet build $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-restore

      - name: Test application
        run: dotnet test $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-build --verbosity normal

      - name: Publish as a single executable
        run: |
          dotnet publish $env:DESKTOP_PROJECT `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.get_version.outputs.VERSION }} `
            --output ./publish-single-file

      - name: Publish as a self-contained package for ZIP
        run: |
          dotnet publish $env:DESKTOP_PROJECT `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:Version=${{ steps.get_version.outputs.VERSION }} `
            --output ./staging/bin

      - name: Add Readme to ZIP package root
        run: |
          if (Test-Path ./README-Release.txt) {
            Copy-Item -Path ./README-Release.txt -Destination ./staging/
          } else {
            Write-Warning "README-Release.txt not found, skipping..."
          }

      - name: Package the final ZIP file
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive -Path ./staging/* -DestinationPath "WallpaperSwitcher-v$version.zip"

      - name: Rename single executable
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          Rename-Item -Path ./publish-single-file/WallpaperSwitcher.exe -NewName "WallpaperSwitcher-v$version.exe"

      - name: Build Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ./publish-single-file/WallpaperSwitcher-v${{ steps.get_version.outputs.VERSION }}.exe
            ./WallpaperSwitcher-v${{ steps.get_version.outputs.VERSION }}.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
