name: .NET Desktop CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: WallpaperSwitcher.slnx
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore $env:SOLUTION_PATH

      - name: Verify formatting
        run: dotnet format $env:SOLUTION_PATH whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION_PATH --configuration $env:CONFIGURATION --no-build --verbosity normal
